- name: configure shipping component
  hosts: shipping
  become: yes
  tasks:
  - name: enable maven 3.9
    command: dnf module enable maven:3.9 -y

  - name: install maven and mysql
    ansible.builtin.dnf:
      name: "{{item}}"
      # state: installed
      state: present
    loop:
    - maven
    - java-25-openjdk-devel
    - mysql

  - name: Find Java 25 executable
    ansible.builtin.shell: |
      find /usr/lib/jvm -type f -path '*/bin/java' | grep 'java-25-openjdk' | head -1
    register: java25_bin
    changed_when: false

  - name: Find Java 25 compiler
    ansible.builtin.shell: |
      find /usr/lib/jvm -type f -path '*/bin/javac' | grep 'java-25-openjdk' | head -1
    register: javac25_bin
    changed_when: false

  - name: Set Java 25 as default
    ansible.builtin.command: alternatives --set java {{ java25_bin.stdout }}
    when: java25_bin.stdout != ""

  - name: Set Java 25 compiler as default
    ansible.builtin.command: alternatives --set javac {{ javac25_bin.stdout }}
    when: javac25_bin.stdout != ""

  - name: Get Java 25 JAVA_HOME
    ansible.builtin.shell: |
      dirname "$(dirname "$(readlink -f /usr/bin/java)")"
    register: java_home
    changed_when: false

  - name: Configure JAVA_HOME permanently
    ansible.builtin.copy:
      dest: /etc/profile.d/java.sh
      content: |
        export JAVA_HOME={{ java_home.stdout }}
        export PATH=$JAVA_HOME/bin:$PATH
      mode: '0644'

  - name: create roboshop system shipping
    ansible.builtin.user:
      name: roboshop
      create_home: false
      shell: /sbin/nologin
      system: true
      comment: "roboshop system shipping"
      home: /app

  - name: removing existing app directory
    ansible.builtin.file:
      path: /app
      state: absent

  - name: removing existing zip files
    ansible.builtin.file:
      path: /tmp/shipping.zip
      state: absent

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
  
  - name: Download the application code
    ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-{{ app_version }}.zip
      # url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
      dest: /tmp/shipping.zip
  
  # This module thinks file exists on ansible control server, needs to extract on to remote machine(shipping)
  # remote_src: yes => means file already exits in shipping server
  - name: extract the code 
    ansible.builtin.unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes
  
  - name: mvn version without JAVA_HOME
    ansible.builtin.command: mvn --version
    args:
      chdir: /app
    register: mvn_default
  
  - name: print mvn version without JAVA_HOME
    ansible.builtin.debug: 
      msg: "{{ mvn_default.stdout_lines }}"

  - name: install maven dependencies
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app
    environment:
      JAVA_HOME: "{{ java_home.stdout }}"
      PATH: "{{ java_home.stdout }}/bin:{{ ansible_env.PATH }}"
  
  - name: rename jar file
    ansible.builtin.command: mv target/shipping.jar shipping.jar 
    args:
      chdir: /app

  - name: copy shipping service to system directory
    ansible.builtin.copy:
      src: shipping.service
      dest: /etc/systemd/system/shipping.service
  
  - name: systemctl daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  
  - name: Start & Enable shipping Service
    ansible.builtin.service:
      name: shipping
      state: started
      enabled: yes
  
