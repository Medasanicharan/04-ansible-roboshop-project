- name: configure catalogue component
  hosts: catalogue
  become: yes
  tasks:
  - name: Disable current module nodejs
    ansible.builtin.command: dnf module disable nodejs -y

  - name: Enable required module nodejs:24
    ansible.builtin.command: dnf module enable nodejs:24 -y

  - name: Install NodeJS
    ansible.builtin.dnf:
      name: nodejs
      state: present
  
  - name: create roboshop system user
    ansible.builtin.user:
      name: roboshop
      create_home: false
      shell: /sbin/nologin
      system: true
      comment: "roboshop system user"
      home: /app

  - name: removing existing app directory
    ansible.builtin.file:
      path: /app
      state: absent

  - name: removing existing zip files
    ansible.builtin.file:
      path: /tmp/catalogue.zip
      state: absent

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
  
  - name: Download the application code
    ansible.builtin.get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      # url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip
  
  # This module thinks file exists on ansible control server, needs to extract on to remote machine(catalogue)
  # remote_src: yes => means file already exits in catalogue server
  - name: extract the code 
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: copy catalogue service to sysem directory
    # ansible.builtin.copy:
    ansible.builtin.template:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service

  - name: copying MongoDB repo
    ansible.builtin.copy:
      src: mongodb.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install MongoDB client
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

  - name: check products loaded or not
    ansible.builtin.command: >
      mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_db_check
# mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
# mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getsiblingDB("catalogue").products.countDocuments()'

  - name: Show/print products count
    ansible.builtin.debug:
      msg: "Number of products loaded: {{ catalogue_db_check }}"
  
  - name: Load products data
    ansible.builtin.shell: >
      mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
    when: catalogue_db_check.stdout | int < 0

  - name: systemctl daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  
  - name: Start & Enable catalogue Service
    ansible.builtin.service:
      name: catalogue
      state: started
      enabled: yes