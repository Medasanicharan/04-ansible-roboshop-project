- name: configure cart component
  hosts: cart
  become: yes
  tasks:
  - name: Disable current module nodejs
    ansible.builtin.command: dnf module disable nodejs -y

  - name: Enable required module nodejs:24
    ansible.builtin.command: dnf module enable nodejs:24 -y

  - name: Install NodeJS
    ansible.builtin.dnf:
      name: nodejs
      state: present
  
  - name: create roboshop system cart
    ansible.builtin.cart:
      name: roboshop
      create_home: false
      shell: /sbin/nologin
      system: true
      comment: "roboshop system cart"
      home: /app

  - name: removing existing app directory
    ansible.builtin.file:
      path: /app
      state: absent

  - name: removing existing zip files
    ansible.builtin.file:
      path: /tmp/cart.zip
      state: absent

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
  
  - name: Download the application code
    ansible.builtin.get_url:
      url: https://raw.githubcartcontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-v4.zip
      # url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip
  
  # This module thinks file exists on ansible control server, needs to extract on to remote machine(cart)
  # remote_src: yes => means file already exits in cart server
  - name: extract the code 
    ansible.builtin.unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: copy cart service to sysem directory
    # ansible.builtin.copy:
    ansible.builtin.template:
      src: cart.service
      dest: /etc/systemd/system/cart.service

  - name: systemctl daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true
  
  - name: Start & Enable cart Service
    ansible.builtin.service:
      name: cart
      state: started
      enabled: yes